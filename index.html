<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令查询工具</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-container input {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-button {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .search-button:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--bg-color);
            border-radius: 0.75rem;
            border: 2px solid var(--border-color);
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            line-height: 1.6;
        }

        .result-container:empty::before {
            content: '在上方输入命令并点击查询按钮';
            color: #64748b;
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>命令查询工具</h1>
        <div class="search-container">
            <input 
                type="text" 
                id="inputText" 
                placeholder="输入要查询的命令，例如：ls" 
                autocomplete="off"
                spellcheck="false"
            >
        </div>
        <button class="search-button" onclick="getDefinition()">查询命令含义</button>
        <div class="result-container" id="output"></div>
    </div>

    <script>
        const input = document.getElementById('inputText');
        const output = document.getElementById('output');

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getDefinition();
            }
        });

        async function getDefinition() {
            const inputText = input.value.trim();
            if (!inputText) {
                output.textContent = '请输入要查询的命令';
                return;
            }

            try {
                output.textContent = '正在查询...';
                const response = await fetch('/api/definition', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: inputText })
                });
                
                if (!response.ok) {
                    throw new Error('网络请求失败');
                }

                const result = await response.json();
                output.textContent = (result.definition || '未找到该命令的解释').replace(/\\n/g, '\n');
            } catch (error) {
                output.textContent = '查询失败，请稍后重试';
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
